<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 888" class="dwg" role="img" aria-labelledby="dgt dgd">
<title id="dgt">The same eight pins, wired six different ways</title>
<desc id="dgd">A chart of microphone connector pin assignments. Five amateur radio families and the OHIS standard run down the left, pin numbers 1 to 8 across the top. The cells show which pin carries microphone audio, push to talk and ground. No two rows agree, and the two Yaesu rows differ from each other.</desc>
<rect width="1600" height="888" fill="#efe8da"/>
<text x="40" y="46" class="hd">THE SAME EIGHT PINS</text>
<text x="40" y="82" class="sub">Microphone audio, push-to-talk and ground, as six different products place them on an eight-pin connector.</text>
